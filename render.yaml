# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Render Blueprint: Audio Clean Service
#
# One Docker web service built from ./Dockerfile (Python + ffmpeg). Uploads, cleaned audio,
# spectrograms and the job list live on a persistent disk at /data. A disk-backed service runs as a
# single instance and deploys restart it in place (brief downtime); a job a deploy interrupts is
# re-run on the next boot, and one interrupted twice is marked failed (POST /jobs/{id}/retry).
#
# API_TOKEN is generated by Render: copy it from the service's Environment tab and send it as
# `X-API-Key: <token>` (or `Authorization: Bearer <token>`) to /jobs and /analyze.
#
# ANTHROPIC_API_KEY is requested once, when the Blueprint is first created. Leave it empty to run
# with the rule-based agent only; set it later in the Environment tab to switch `auto` to Claude.

services:
  - type: web
    name: audio-clean
    runtime: docker
    # Starter = 0.5 CPU / 512 MB ($7/month). Measured on a 30-minute MP3: ~67 MB peak in Python and
    # ~67 MB in ffmpeg (every step streams, so longer files don't need more). Starter is the smallest
    # plan that can have a disk; free web services can't, and spin down after 15 idle minutes.
    # Standard (1 CPU) cleans about twice as fast; the work is ffmpeg, so CPU is what helps.
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Dependency-free liveness: 503 if ffmpeg is missing (a broken image is never promoted); never calls
    # the Claude API, so an Anthropic outage can't restart a healthy instance.
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - app/**
        - main.py
        - Dockerfile
        - .dockerignore
        - requirements.txt
      ignoredPaths:
        - "**/*.md"
    disk:
      name: audio-clean-data
      mountPath: /data
      sizeGB: 10
    envVars:
      # --- Access control ---
      - key: API_TOKEN
        generateValue: true

      # --- Agent that chooses the cleaning strategy ---
      # auto = Claude when ANTHROPIC_API_KEY is set, otherwise the rule-based agent. heuristic or claude
      # force one; jobs can still choose per upload with the `agent` form field.
      - key: CLEANING_AGENT
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      # low | medium | high | xhigh | max: how hard Claude thinks per turn (cost and decision time).
      - key: CLAUDE_EFFORT
        value: medium
      - key: AGENT_MAX_TRIALS
        value: "6"
      # Length of the excerpt every candidate plan is tried on.
      - key: PREVIEW_SECONDS
        value: "45"
      # Long recordings are measured on their first 15 minutes.
      - key: ANALYSIS_MAX_SECONDS
        value: "900"

      # --- Upload and worker limits ---
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: MAX_AUDIO_SECONDS
        value: "7200"
      # One job at a time: on 0.5 CPU, parallel jobs only make each one slower.
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: MAX_QUEUE_SIZE
        value: "20"

      # --- Storage (the disk above) ---
      - key: DATA_DIR
        value: /data
